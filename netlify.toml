# Netlify configuration for Remix Vite projects

[build]
  # Use pnpm to build the site
  command = "pnpm run build"
  # Specify the directory containing the built client-side assets
  publish = "build/client"

[dev]
  # Command to run the local development server
  command = "pnpm run dev"
  # Specify that the framework is Vite
  framework = "vite"

# Function settings
[functions]
  # Function settings
  node_bundler = "esbuild"

  # Define function timeout
  [functions.timeout]
  seconds = 30

# Set environment variables for all functions
[build.environment]
  NODE_VERSION = "22.15.0"

# Redirects to route all requests to the Remix serverless function
[[redirects]]
from = "/*"
to = "/.netlify/functions/server"
status = 200
force = true # Optional: Use force=true if you want to override static files with function responses for certain paths
