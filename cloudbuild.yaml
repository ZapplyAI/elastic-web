steps:
# Build the container image
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/$PROJECT_ID/elasticApp-ai:$COMMIT_SHA', '--target', 'elasticApp-ai-production', '.']
# Push the container image to Container Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/elasticApp-ai:$COMMIT_SHA']
# Deploy container image to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
  - 'run'
  - 'deploy'
  - 'elasticApp-ai'
  - '--image'
  - 'gcr.io/$PROJECT_ID/elasticApp-ai:$COMMIT_SHA'
  - '--region'
  - '${_REGION}'
  - '--platform'
  - 'managed'
  - '--allow-unauthenticated'
  - '--port'
  - '5173'
  - '--memory'
  - '2Gi'
  - '--cpu'
  - '1'
  - '--set-env-vars'
  - 'NODE_ENV=production'
substitutions:
  _REGION: us-central1  # Default region, can be overridden
images:
- 'gcr.io/$PROJECT_ID/elasticApp-ai:$COMMIT_SHA'
